name: apt repo

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Build on the oldest Debian we target: its dpkg-deb uses xz, which every
    # client can read (Ubuntu's defaults to zstd).
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper config-package-dev lintian apt-utils gnupg

      - name: Build packages
        run: scripts/build-packages.sh

      - name: Lintian
        run: lintian --fail-on error out/*.deb

      - name: Import signing key
        if: github.event_name != 'pull_request'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Build repository
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_ID: ${{ vars.APT_SIGNING_KEY_ID }}
        run: scripts/build-repo.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: out/*.deb

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Summary
        run: |
          {
            echo '```sh'
            echo 'curl -fsSL ${{ steps.deployment.outputs.page_url }}install.sh | sudo sh'
            echo 'sudo apt install froggle-ca froggle-ws'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
