# Installed by froggle-ws. qt6ct copies this to ~/.config/qt6ct/ the first
# time a user runs a Qt6 app without a config of their own; after that the
# user's copy (editable with the qt6ct tool) wins.
[Appearance]
style=Fusion
custom_palette=true
color_scheme_path=/usr/share/qt6ct/colors/darker.conf
icon_theme=Adwaita
standard_dialogs=gtk3
