# Installed by froggle-ws. qt5ct copies this to ~/.config/qt5ct/ the first
# time a user runs a Qt5 app without a config of their own; after that the
# user's copy (editable with the qt5ct tool) wins.
[Appearance]
style=Fusion
custom_palette=true
color_scheme_path=/usr/share/qt5ct/colors/darker.conf
icon_theme=Adwaita
standard_dialogs=gtk3
